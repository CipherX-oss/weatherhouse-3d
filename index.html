        <!-- Weather Card -->

          <!-- Location Search Box -->
          <div class="location-search">
            <div class="search-input-group">
              <input
                type="text"
                id="city-input"
                placeholder="Enter city or country..."
                value="New York"
                aria-label="Search for a city or country"
              />
              <button id="search-btn" type="button" aria-label="Search weather">
                <i class="wi wi-cloudy"></i>
              </button>
            </div>
            <div id="location-info">
              <div id="city-name">New York, US</div>
              <div id="local-time">12:30 PM</div>
            </div>
          </div>

          <nav class="weather-nav" aria-label="Choose weather effect">
            <ul>
              <li>
                <button id="button-snow" class="active" type="button" aria-label="Snow" aria-pressed="true">
                  <i class="wi wi-snow" aria-hidden="true"></i>
                </button>
              </li>
              <li>
                <button id="button-wind" type="button" aria-label="Wind" aria-pressed="false">
                  <i class="wi wi-strong-wind" aria-hidden="true"></i>
                </button>
              </li>
              <li>

              </li>
              <li>
